name: Compiler AikoHub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tests du serveur de licences
        run: |
          mkdir -p screenshots
          cd server
          AIKO_TOKEN_OUT="$GITHUB_WORKSPACE/screenshots/jeton-test.json" node --test test/licences.test.mjs 2>&1 | tee ../screenshots/serveur.txt
      - name: Compilation de l'appli (universelle)
        if: always()
        run: |
          set +e
          UNIVERSAL=1 ./macos/build.sh > screenshots/build.log 2>&1
          code=$?
          codesign -d -r- macos/build/AikoHub.app >> screenshots/build.log 2>&1
          cat screenshots/build.log
          grep -E "error:" screenshots/build.log | head -n 15 | while IFS= read -r l; do echo "::error title=Compilation::$l"; done
          exit $code
      - name: Serveur de licences en local (wrangler dev)
        run: |
          cd server
          node keys.mjs > /tmp/keys.json
          PRIV=$(node -e "console.log(require('/tmp/keys.json').privateKey)")
          PUB=$(node -e "console.log(require('/tmp/keys.json').publicKey)")
          printf 'SIGNING_KEY=%s\nPUBLIC_KEY=%s\nADMIN_PASSWORD=admin-de-test\n' "$PRIV" "$PUB" > .dev.vars
          echo "AIKO_PUBLIC_KEY=$PUB" >> "$GITHUB_ENV"
          nohup npx --yes wrangler@3.80.0 dev --ip 127.0.0.1 --port 8787 > /tmp/wrangler.log 2>&1 &
          for i in $(seq 1 90); do curl -fs http://127.0.0.1:8787/ >/dev/null && break; sleep 2; done
          curl -s http://127.0.0.1:8787/ || { tail -n 30 /tmp/wrangler.log; echo "::error title=Serveur::wrangler dev n'a pas démarré"; exit 1; }
      - name: Test en direct (licences, activation, installation)
        timeout-minutes: 5
        env:
          AIKO_SERVER: http://127.0.0.1:8787
          AIKO_ADMIN: admin-de-test
          AIKO_TOKEN_FILE: ${{ github.workspace }}/screenshots/jeton-test.json
        run: |
          export AIKO_LICENCE_DIR="$RUNNER_TEMP/licence"
          ./macos/build/AikoHub.app/Contents/MacOS/AikoHub --selftest "$PWD/screenshots" 2>&1 | tee screenshots/appli.txt
      - name: Publier le rapport (branche captures-Mac)
        if: always()
        run: |
          rm -f screenshots/jeton-test.json
          cd screenshots || exit 0
          git init -q -b captures-Mac
          git -c user.name=ci -c user.email=ci@aikohub add -A
          git -c user.name=ci -c user.email=ci@aikohub commit -q -m "Rapport Mac" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" HEAD:captures-Mac > push.txt 2>&1 \
            || { tail -n 5 push.txt | while IFS= read -r l; do echo "::error title=Envoi du rapport::$l"; done; exit 1; }
      - name: Archive
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent macos/build/AikoHub.app dist/AikoHub-Mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AikoHub-Mac
          path: dist/AikoHub-Mac.zip

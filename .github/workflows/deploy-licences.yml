name: Mettre en ligne le serveur de licences

# Nécessite 3 secrets du dépôt : CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, AIKO_ADMIN_PASSWORD
# (+ AIKO_GITHUB_TOKEN, facultatif, pour que les outils se téléchargent depuis AikoHub).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier les secrets
        run: |
          missing=""
          [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -z "${{ secrets.AIKO_ADMIN_PASSWORD }}" ] && missing="$missing AIKO_ADMIN_PASSWORD"
          if [ -n "$missing" ]; then echo "::error title=Secrets manquants::$missing"; exit 1; fi
      - name: Tests
        run: node --test test/licences.test.mjs
      - name: Vérifier l'accès Cloudflare
        run: |
          # Nettoie les espaces ou retours à la ligne collés par erreur
          ACC=$(printf %s "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          # Si du texte a été collé autour de l'identifiant, on ne garde que lui
          FOUND=$(printf %s "$ACC" | tr 'A-F' 'a-f' | grep -oE '[0-9a-f]{32}' | head -n 1)
          [ -n "$FOUND" ] && ACC=$FOUND
          TOK=$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          echo "CLOUDFLARE_ACCOUNT_ID=$ACC" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_API_TOKEN=$TOK" >> "$GITHUB_ENV"
          API=https://api.cloudflare.com/client/v4
          msg() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log(j.success?"ok":(j.errors||[]).map(e=>e.code+" "+e.message).join(" / "))}catch(e){console.log("réponse illisible")}})'; }
          echo "$ACC" | grep -qE '^[0-9a-f]{32}$' || { echo "::error title=Account ID::CLOUDFLARE_ACCOUNT_ID n'a pas le bon format (32 caractères 0-9 a-f, il en a ${#ACC}). Recopie l'Account ID de la page Workers & Pages."; exit 1; }
          V=$(curl -s -H "Authorization: Bearer $TOK" $API/user/tokens/verify | msg)
          if [ "$V" != "ok" ]; then
            V2=$(curl -s -H "Authorization: Bearer $TOK" $API/accounts/$ACC/tokens/verify | msg)
            [ "$V2" = "ok" ] || { echo "::error title=Jeton Cloudflare::Jeton refusé par Cloudflare ($V). Recrée-le avec le modèle « Edit Cloudflare Workers » et recolle-le dans CLOUDFLARE_API_TOKEN."; exit 1; }
          fi
          echo "Jeton : valide"
          A=$(curl -s -H "Authorization: Bearer $TOK" $API/accounts/$ACC | msg)
          [ "$A" = "ok" ] || { echo "::error title=Compte Cloudflare::Le jeton n'a pas accès à ce compte ($A). Vérifie l'Account ID, et dans le jeton « Account Resources : Include → ton compte »."; exit 1; }
          echo "Compte : ok"
          K=$(curl -s -H "Authorization: Bearer $TOK" "$API/accounts/$ACC/storage/kv/namespaces?per_page=5" | msg)
          [ "$K" = "ok" ] || { echo "::error title=Permission KV::Le jeton ne peut pas gérer les bases KV ($K). Il faut la permission « Workers KV Storage : Edit » (incluse dans le modèle Edit Cloudflare Workers)."; exit 1; }
          echo "KV : ok"
          S=$(curl -s -H "Authorization: Bearer $TOK" $API/accounts/$ACC/workers/subdomain | msg)
          [ "$S" = "ok" ] || echo "::warning title=Sous-domaine workers.dev::$S"
      - name: Base de données des licences (Cloudflare KV)
        run: |
          W="npx --yes wrangler@3.80.0"
          ID=$($W kv namespace list 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s);const n=a.find(x=>/aikohub-licences-LICENCES/.test(x.title));console.log(n?n.id:"")}catch(e){console.log("")}})')
          if [ -z "$ID" ]; then
            $W kv namespace create LICENCES > /tmp/kv.txt 2>&1 || { cat /tmp/kv.txt; echo "::error title=KV::création impossible : $(sed -e 's/\x1b\[[0-9;]*m//g' /tmp/kv.txt | grep -vE 'open an issue|^\s*$|wrangler 3|───|update available' | tail -n 6 | tr '\n' ' ' | cut -c1-600)"; exit 1; }
            ID=$(grep -oE '[0-9a-f]{32}' /tmp/kv.txt | head -n 1)
          fi
          [ -n "$ID" ] || { echo "::error title=KV::identifiant introuvable"; exit 1; }
          sed -i "s/REMPLACE_PAR_LE_DEPLOIEMENT/$ID/" wrangler.toml
          echo "KV : $ID"
      - name: Mise en ligne
        run: |
          W="npx --yes wrangler@3.80.0"
          $W deploy > /tmp/deploy.txt 2>&1 || { cat /tmp/deploy.txt; echo "::error title=Déploiement::$(tail -n 4 /tmp/deploy.txt | tr '\n' ' ')"; exit 1; }
          cat /tmp/deploy.txt
          URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' /tmp/deploy.txt | head -n 1)
          echo "$URL" > url.txt
          echo "::notice title=Adresse du serveur::$URL"
      - name: Clés et mot de passe (secrets du serveur)
        run: |
          W="npx --yes wrangler@3.80.0"
          if ! $W secret list 2>/dev/null | grep -q SIGNING_KEY; then
            node keys.mjs > /tmp/keys.json
            node -e "console.log(require('/tmp/keys.json').privateKey)" | $W secret put SIGNING_KEY
            node -e "console.log(require('/tmp/keys.json').publicKey)" | $W secret put PUBLIC_KEY
            node -e "console.log(require('/tmp/keys.json').publicKey)" > public-key.txt
            rm /tmp/keys.json
            echo "::notice title=Clé publique::$(cat public-key.txt)"
          fi
          printf '%s' "${{ secrets.AIKO_ADMIN_PASSWORD }}" | $W secret put ADMIN_PASSWORD
          if [ -n "${{ secrets.AIKO_GITHUB_TOKEN }}" ]; then
            printf '%s' "${{ secrets.AIKO_GITHUB_TOKEN }}" | $W secret put GITHUB_TOKEN
          else
            echo "::warning title=Téléchargements::secret AIKO_GITHUB_TOKEN absent : AikoHub ne pourra pas encore télécharger les outils"
          fi
          curl -s "$(cat url.txt)/" ; echo
      - name: Enregistrer l'adresse et la clé publique dans le dépôt
        working-directory: .
        run: |
          git config user.name baptslrx
          git config user.email 261882867+baptslrx@users.noreply.github.com
          git add server/url.txt server/public-key.txt 2>/dev/null || git add server/url.txt
          git diff --cached --quiet || { git commit -m "Serveur de licences : adresse et clé publique"; git push; }
